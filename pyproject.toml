[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "norsk-lov-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering for Norwegian legal text, evaluated on tax law"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reza Azad Gholami" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "lxml>=5.2",
  "pandas>=2.2",
  "pyarrow>=16",
  "snowballstemmer>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Dense search and reranking. Kept apart so that CI runs without model downloads.
embed = ["sentence-transformers>=6.3", "torch>=2.15"]
# The Streamlit demo in app/.
demo = ["streamlit>=1.67"]

[project.scripts]
norsk-lov-rag = "norsk_lov_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/norsk_lov_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
